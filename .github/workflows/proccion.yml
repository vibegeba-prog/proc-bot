name: УК Процион — ЖК Мурино

on:
  schedule:
    # Утро 8:45 МСК (5:45 UTC) по будням: пн-пт
    - cron: '45 5 * * 1-5'
    # Вечер 20:30 МСК (17:30 UTC) по будням: пн-пт
    - cron: '30 17 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим запуска'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

jobs:
  morning:
    if: github.event.schedule == '45 5 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'morning')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python proccion_bot.py --mode morning
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}

  evening:
    if: github.event.schedule == '30 17 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'evening')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python proccion_bot.py --mode evening
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
